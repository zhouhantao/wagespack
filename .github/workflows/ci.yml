name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run e2e
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
      - shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/wagespack.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          "$hash  wagespack.exe" | Set-Content 'src-tauri/target/release/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wagespack-windows-x64
          path: |
            src-tauri/target/release/wagespack.exe
            src-tauri/target/release/SHA256SUMS.txt
